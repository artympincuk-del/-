<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Рулетка</title>
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="balance">Баланс: <b id="balance">—</b></div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="640" height="640"></canvas>
    <div class="hub"></div>
  </div>

  <div class="result" id="result"></div>

  <div class="card">
    <h3>Ставка</h3>
    <div class="amount-row">
      <input id="amount" type="number" inputmode="numeric" min="1" value="100" />
    </div>
    <div class="chip-row">
      <button class="chip" data-amount="10">10</button>
      <button class="chip" data-amount="50">50</button>
      <button class="chip" data-amount="100">100</button>
      <button class="chip" data-amount="500">500</button>
      <button class="chip" data-amount="max">MAX</button>
    </div>
  </div>

  <div class="card">
    <h3>Тип ставки</h3>
    <div class="bet-grid" id="bet-grid">
      <button class="bet-btn red" data-type="color" data-value="red">🔴 Красное</button>
      <button class="bet-btn black" data-type="color" data-value="black">⚫ Чёрное</button>
      <button class="bet-btn" data-type="parity" data-value="even">Чёт</button>
      <button class="bet-btn" data-type="parity" data-value="odd">Нечет</button>
      <button class="bet-btn" data-type="range" data-value="low">1-18</button>
      <button class="bet-btn" data-type="range" data-value="high">19-36</button>
      <button class="bet-btn" data-type="dozen" data-value="1">Дюжина 1</button>
      <button class="bet-btn" data-type="dozen" data-value="2">Дюжина 2</button>
      <button class="bet-btn" data-type="dozen" data-value="3">Дюжина 3</button>
      <button class="bet-btn full" data-type="number" data-value="">🔢 На число</button>
    </div>
    <div class="number-input" id="number-input">
      <input id="number-value" type="number" inputmode="numeric" min="0" max="36" placeholder="Число от 0 до 36" />
    </div>
  </div>

  <button class="spin-btn" id="spin-btn">Крутить</button>
  <div class="error" id="error"></div>

  <script src="app.js"></script>
</body>
</html>
